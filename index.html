<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Overclock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000000;
    --fg:#F4F4F1;
    --fg-dim:#8A8A85;
    --line:#1E1E1C;
    --accent:#E4293B;
    --accent-glow:rgba(228,41,59,0.35);
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:var(--fg);
    font-family:'Lora', serif;
  }

  header{
    background:#000000;
    position:sticky;
    top:0;
    z-index:100;
  }

  header::after{
    content:"";
    display:block;
    height:2px;
    background:linear-gradient(90deg, transparent 0%, var(--accent) 50%, transparent 100%);
    opacity:0.8;
  }

  .header-inner{
    max-width:1200px;
    margin:0 auto;
    padding:18px 32px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:24px;
  }

  /* --- Logo + nombre --- */
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
    text-decoration:none;
    color:var(--fg);
  }

  .brand img{
    height:36px;
    width:36px;
    display:block;
    border-radius:50%;
    transition:filter .25s ease;
    filter:drop-shadow(0 0 0 rgba(228,41,59,0));
  }

  .brand:hover img{
    filter:drop-shadow(0 0 10px var(--accent-glow));
  }

  .brand span{
    font-family:'Lora', serif;
    font-weight:600;
    font-size:1.25rem;
    letter-spacing:0.02em;
    position:relative;
  }

  .brand span::after{
    content:"";
    position:absolute;
    left:0;
    bottom:-6px;
    width:0%;
    height:2px;
    background:var(--accent);
    transition:width .25s ease;
  }

  .brand:hover span::after{
    width:100%;
  }

  /* --- Navegación derecha --- */
  .header-right{
    display:flex;
    align-items:center;
    gap:28px;
    font-family:'Lora', serif;
  }

  /* --- Menú desplegable --- */
  .menu{
    position:relative;
  }

  .menu-toggle{
    background:none;
    border:none;
    border-bottom:2px solid transparent;
    font-family:'Lora', serif;
    font-size:1rem;
    color:var(--fg);
    display:flex;
    align-items:center;
    gap:8px;
    cursor:pointer;
    padding:8px 4px;
    transition:border-color .2s ease;
  }

  .menu.open .menu-toggle{
    border-bottom-color:var(--accent);
  }

  .menu-toggle:hover{
    color:var(--accent);
  }

  .menu-toggle:focus-visible,
  .login-link:focus-visible{
    outline:1px solid var(--accent);
    outline-offset:4px;
  }

  .menu-indicator{
    font-size:0.85rem;
    line-height:1;
    color:var(--fg-dim);
    transition:color .2s ease;
  }

  .menu-toggle:hover .menu-indicator{
    color:var(--accent);
  }

  .menu-dropdown{
    position:absolute;
    top:calc(100% + 14px);
    right:0;
    min-width:200px;
    background:#0A0A0A;
    border:1px solid var(--line);
    padding:8px;
    display:none;
    flex-direction:column;
  }

  .menu.open .menu-dropdown{
    display:flex;
  }

  .menu-dropdown a{
    color:var(--fg);
    text-decoration:none;
    font-size:0.95rem;
    padding:10px 12px;
    border-radius:2px;
  }

  .menu-dropdown a:hover{
    background:#161614;
    color:var(--accent);
  }

  /* --- Iniciar sesión --- */
  .login-link{
    color:var(--fg);
    text-decoration:none;
    font-size:1rem;
    font-weight:500;
    background:var(--accent);
    padding:9px 20px;
    transition:background .2s ease, box-shadow .2s ease, transform .15s ease;
  }

  .login-link:hover{
    background:#FF3B4E;
    box-shadow:0 0 16px var(--accent-glow);
    transform:translateY(-1px);
  }

  /* --- Cuerpo de ejemplo (solo para previsualizar el header) --- */
  main{
    min-height:60vh;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--fg-dim);
    font-family:'Lora', serif;
    font-style:italic;
    background:radial-gradient(circle at 50% 30%, rgba(228,41,59,0.10) 0%, transparent 55%);
  }

  @media (max-width:560px){
    .header-inner{ padding:16px 18px; }
    .brand span{ font-size:1.05rem; }
    .header-right{ gap:16px; }
    .login-link{ padding:7px 14px; font-size:0.9rem; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">

    <a class="brand" href="#">
      <img src="90631-modified.png" alt="Overclock">
      <span>Overclock</span>
    </a>

    <div class="header-right">

      <div class="menu" id="menu">
        <button class="menu-toggle" id="menuToggle" aria-expanded="false" aria-controls="menuDropdown">
          Menú
          <span class="menu-indicator" id="menuIndicator">﹀</span>
        </button>
        <div class="menu-dropdown" id="menuDropdown">
          <a href="#">Inicio</a>
          <a href="#">Servicios</a>
          <a href="#">Nosotros</a>
          <a href="#">Contacto</a>
        </div>
      </div>

      <a class="login-link" href="#">Iniciar sesión</a>

    </div>

  </div>
</header>

<main>
  Contenido de la página aquí
</main>

<script>
  const menu = document.getElementById('menu');
  const menuToggle = document.getElementById('menuToggle');
  const menuIndicator = document.getElementById('menuIndicator');

  menuToggle.addEventListener('click', () => {
    const isOpen = menu.classList.toggle('open');
    menuToggle.setAttribute('aria-expanded', isOpen);
    menuIndicator.textContent = isOpen ? '︿' : '﹀';
  });

  document.addEventListener('click', (e) => {
    if (!menu.contains(e.target) && menu.classList.contains('open')) {
      menu.classList.remove('open');
      menuToggle.setAttribute('aria-expanded', 'false');
      menuIndicator.textContent = '﹀';
    }
  });
</script>

</body>
</html>
